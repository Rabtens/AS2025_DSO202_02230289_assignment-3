apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ required "secret.dbPassword must be set (use -f values-<env>.yaml or --set-string secret.dbPassword=...)" .Values.secret.dbPassword | quote }}
  POSTGRES_USER: {{ .Values.secret.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | quote }}
