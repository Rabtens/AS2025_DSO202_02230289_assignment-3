{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend
spec:
  host: backend-svc
  subsets:
    - name: v1
      labels:
        version: v1
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 2s
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend
spec:
  host: frontend-svc
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend
spec:
  hosts:
    - backend-svc
  http:
    - name: reads
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: backend-svc
            subset: v1
      timeout: 6s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
    - name: writes
      route:
        - destination:
            host: backend-svc
            subset: v1
      timeout: 6s
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: connect-failure,refused-stream
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
spec:
  hosts:
    - frontend-svc
  http:
    - route:
        - destination:
            host: frontend-svc
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: frontend-allow-ingress
spec:
  selector:
    matchLabels:
      tier: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [{{ .Values.istio.ingressPrincipal | quote }}]
      to:
        - operation:
            methods: ["GET", "HEAD"]
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-ingress
spec:
  selector:
    matchLabels:
      tier: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [{{ .Values.istio.ingressPrincipal | quote }}]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            paths: ["/api/tasks", "/api/tasks/*", "/api/status"]
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: db-allow-backend-and-backups
spec:
  selector:
    matchLabels:
      tier: database
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/backend-sa" .Release.Namespace | quote }}
              - {{ printf "cluster.local/ns/%s/sa/taskbackup-runner" .Release.Namespace | quote }}
      to:
        - operation:
            ports: ["5432"]
{{- end }}
