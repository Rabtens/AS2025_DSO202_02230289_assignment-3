apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: dso202-staging

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

images:
  - name: sarojsanyasi/dso202-backend
    newTag: "1.0"
  - name: sarojsanyasi/dso202-frontend
    newTag: "1.0"

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: task-tracker-config
    behavior: merge
    literals:
      - CORS_ORIGIN=https://staging.tasktracker.local

secretGenerator:
  - name: task-tracker-secret
    behavior: merge
    literals:
      - DB_PASSWORD=StagePass2026
      - POSTGRES_PASSWORD=StagePass2026

patches:
  - path: patch-ingress-host.yaml
    target:
      kind: Ingress
