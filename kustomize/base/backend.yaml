apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    dso202/owner: platform-team
  labels:
    app: task-tracker
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: backend
        version: v1
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: sarojsanyasi/dso202-backend:1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    app: task-tracker
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: task-tracker
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
